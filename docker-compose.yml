services:
  db:
    image: postgres:16
    container_name: coworking_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: coworking_db
    ports:
      - "5432:5432"
      # PORTA HOST:PORTA CONTEINER(MESMA PORTA QUE O EXPRESS IRÁ ESCUTAR)
    volumes:
      # O './postgres_data' cria uma pasta real dentro do seu projeto
      - ./postgres_data:/var/lib/postgresql/data